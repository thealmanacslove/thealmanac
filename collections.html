<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Collections — The Almanac</title>
  <meta name="description" content="Explore the collections of The Almanac — Cities in the Sky, Welcome to Aurora, Devotion, and The Oracle. Original paintings by Elisa Della Faille.">

  <!-- Open Graph -->
  <meta property="og:title" content="Collections — The Almanac">
  <meta property="og:description" content="Explore the collections of The Almanac — Cities in the Sky, Welcome to Aurora, Devotion, and The Oracle. Original paintings by Elisa Della Faille.">
  <meta property="og:image" content="https://thealmanacslove.github.io/thealmanac/img/hero1-big.webp">
  <meta property="og:url" content="https://thealmanacslove.github.io/thealmanac/collections.html">
  <meta property="og:type" content="website">

  <link rel="canonical" href="https://thealmanacslove.github.io/thealmanac/collections.html">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="img/almanaclogo.svg" type="image/svg+xml">

  <style>
    /* ─── VIDEO HERO ─── */
    .collections-hero {
      position: sticky;
      top: 0;
      z-index: 0;
      width: 100%;
      max-height: 60vh;
      overflow: hidden;
      line-height: 0;
    }

    /* Content slides over the sticky hero */
    .collections-section,
    footer {
      position: relative;
      z-index: 1;
      background: var(--bg);
    }

    .collections-hero video {
      width: 100%;
      max-height: 60vh;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* ─── SECTION ─── */
    .collections-section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 28px 80px;
    }

    .collections-section > .page-eyebrow {
      margin-bottom: 32px;
    }

    /* ─── GRID ─── */
    .collections-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      align-items: start;
    }

    /* ─── CARD ─── */
    .collection-card {
      cursor: pointer;
    }

    .card-img-wrap {
      aspect-ratio: 3 / 2;
      position: relative;
      overflow: hidden;
      border: 0.5px solid transparent;
      transition: border-color 0.3s ease;
    }

    .collection-card:hover .card-img-wrap {
      border-color: var(--border);
    }

    .card-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .card-hover-img {
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    @media (hover: hover) {
      .collection-card:hover .card-hover-img { opacity: 1; }
    }

    .card-name {
      font-size: 14px;
      font-weight: 200;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink);
      margin-top: 12px;
      text-align: center;
    }

    /* ─── EXPANDED PANEL ─── */
    .collection-panel {
      grid-column: 1 / -1;
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition: grid-template-rows 0.5s ease, opacity 0.5s ease;
    }

    .collection-panel.open {
      grid-template-rows: 1fr;
      opacity: 1;
    }

    .panel-inner {
      min-height: 0;
      overflow: hidden;
      background: #D9BFB4;
    }

    .panel-content {
      padding: 48px 28px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .panel-title {
      font-size: 22px;
      font-weight: 200;
      letter-spacing: 0.08em;
      color: var(--ink);
    }

    .panel-close {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: var(--ink);
      transition: color 0.2s ease;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .panel-close:hover { color: var(--klein); }

    .panel-close svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ─── SCROLL STRIP ─── */
    .panel-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      margin: 0 -28px;
      padding: 0 28px 16px;
    }

    .panel-scroll::-webkit-scrollbar { display: none; }

    .panel-item {
      flex: 0 0 auto;
      scroll-snap-align: start;
    }

    .panel-img-wrap {
      height: 320px;
      width: auto;
      overflow: hidden;
      flex-shrink: 0;
    }

    .panel-img-wrap img {
      height: 100%;
      width: auto;
      display: block;
      cursor: zoom-in;
    }

    .panel-img-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .panel-item-size,
    .panel-item-medium {
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-top: 6px;
      text-transform: uppercase;
    }

    /* ─── INQUIRE ─── */
    .panel-inquire {
      border-top: 0.5px solid rgba(42, 40, 37, 0.15);
      padding-top: 32px;
      margin-top: 32px;
    }

    .panel-inquire-eyebrow {
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .panel-inquire-sub {
      font-size: 13px;
      font-weight: 300;
      color: var(--body-text);
      letter-spacing: 0.04em;
      margin-bottom: 28px;
    }

    .panel-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 480px;
    }

    .panel-form input,
    .panel-form textarea {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: 0;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 300;
      color: var(--ink);
      letter-spacing: 0.06em;
      padding: 14px 16px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s ease;
      resize: vertical;
      -webkit-appearance: none;
      appearance: none;
    }

    .panel-form input::placeholder,
    .panel-form textarea::placeholder {
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 11px;
    }

    .panel-form input:focus,
    .panel-form textarea:focus { border-color: var(--ink); }

    .panel-submit {
      font-family: var(--font);
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      padding: 16px;
      background: var(--klein);
      color: #fff;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s ease;
    }

    .panel-submit:hover:not(:disabled) { background: var(--ink); }

    .panel-submit:disabled {
      background: var(--border);
      color: var(--muted);
      cursor: not-allowed;
    }

    .panel-success {
      display: none;
      font-size: 14px;
      font-weight: 200;
      letter-spacing: 0.08em;
      color: var(--ink);
      text-align: center;
      padding: 20px 0;
    }

    /* ─── LIGHTBOX ─── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.78);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    .lightbox-frame {
      position: relative;
      max-width: 90vw;
      max-height: 88vh;
    }

    .lightbox-frame img {
      max-width: 90vw;
      max-height: 88vh;
      object-fit: contain;
      display: block;
    }

    .lightbox-close {
      position: absolute;
      top: -13px;
      right: -13px;
      width: 26px;
      height: 26px;
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 300;
      color: var(--ink);
      transition: background 0.2s ease, color 0.2s ease;
      z-index: 201;
      line-height: 1;
    }

    .lightbox-close:hover {
      background: var(--ink);
      color: var(--bg);
    }

    /* ─── MOBILE CROSSFADE ─── */
    @media (hover: none) {
      .card-hover-img {
        animation: crossfade 6s infinite;
      }
    }

    @keyframes crossfade {
      0%, 40% { opacity: 0; }
      50%, 90% { opacity: 1; }
      100%     { opacity: 0; }
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 768px) {
      .collections-grid { grid-template-columns: 1fr; }
      .panel-img-wrap   { height: 240px; }
    }

    @media (max-width: 400px) {
      .panel-img-wrap { height: 200px; }
    }
  </style>
</head>

  <script src="main.js" defer></script>
  <script>
  (function () {
    // ── Painting data — update size and medium for each piece ──
    const PAINTINGS = {
      'Cities in the Sky': [
        { label: 'Cities in the Sky 01', src: 'img/citiesinthesky1.png', size: '00 × 00 cm', medium: 'Medium' },
        { label: 'Cities in the Sky 02', src: 'img/citiesinthesky2.png', size: '00 × 00 cm', medium: 'Medium' },
        { label: 'Cities in the Sky 03', src: 'img/citiesinthesky3.png', size: '00 × 00 cm', medium: 'Medium' },
        { label: 'Cities in the Sky 04', src: 'img/citiesinthesky4.png', size: '00 × 00 cm', medium: 'Medium' },
        { label: 'Cities in the Sky 05', src: 'img/citiesinthesky5.png', size: '00 × 00 cm', medium: 'Medium' },
        { label: 'Cities in the Sky 06', src: 'img/citiesinthesky6.png', size: '00 × 00 cm', medium: 'Medium' },
      ],
      'Welcome to Aurora': [
        { label: 'Welcome to Aurora 01', src: 'img/welcometoaurora1.png', size: '00 × 00 cm', medium: 'Medium' },
        { label: 'Welcome to Aurora 02', src: 'img/welcometoaurora2.png', size: '00 × 00 cm', medium: 'Medium' },
        { label: 'Welcome to Aurora 03', src: 'img/welcometoaurora3.png', size: '00 × 00 cm', medium: 'Medium' },
      ],
      'Devotion': [
        { label: 'Devotion 01', src: 'img/devotion1.png', size: '00 × 00 cm', medium: 'Medium' },
        { label: 'Devotion 02', src: 'img/devotion2.png', size: '00 × 00 cm', medium: 'Medium' },
        { label: 'Devotion 03', src: 'img/devotion3.png', size: '00 × 00 cm', medium: 'Medium' },
        { label: 'Devotion 04', src: 'img/devotion4.png', size: '00 × 00 cm', medium: 'Medium' },
        { label: 'Devotion 05', src: 'img/devotion5.png', size: '00 × 00 cm', medium: 'Medium' },
      ],
      'The Oracle': [
        { label: 'The Oracle 01', src: 'img/theoracle1.png', size: '00 × 00 cm', medium: 'Medium' },
        { label: 'The Oracle 02', src: 'img/theoracle2.png', size: '00 × 00 cm', medium: 'Medium' },
        { label: 'The Oracle 03', src: 'img/theoracle3.png', size: '00 × 00 cm', medium: 'Medium' },
        { label: 'The Oracle 04', src: 'img/theoracle4.png', size: '00 × 00 cm', medium: 'Medium' },
      ],
    };

    const grid  = document.getElementById('collectionsGrid');
    const cards = Array.from(grid.querySelectorAll('.collection-card'));
    let activePanel = null;
    let activeCard  = null;
    let openingNow  = false;

    // ── Lightbox ──
    const lightbox      = document.getElementById('lightbox');
    const lightboxFrame = document.getElementById('lightboxFrame');
    const lightboxImg   = document.getElementById('lightboxImg');

    function openLightbox(src, alt) {
      lightboxImg.src = src;
      lightboxImg.alt = alt;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('lightboxClose').addEventListener('click', e => {
      e.stopPropagation();
      closeLightbox();
    });

    lightbox.addEventListener('click', e => {
      if (!lightboxFrame.contains(e.target)) {
        e.stopPropagation();
        closeLightbox();
      }
    });

    // ── Escape closes panel or lightbox ──
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (lightbox.classList.contains('open')) { closeLightbox(); return; }
        closePanel();
      }
    });

    // ── Click outside closes panel (not when lightbox is open) ──
    document.addEventListener('click', e => {
      if (openingNow)  return;
      if (!activePanel) return;
      if (lightbox.classList.contains('open')) return;
      if (activePanel.contains(e.target)) return;
      closePanel();
    });

    // ── Card interactions ──
    cards.forEach(card => {
      const hoverImg = card.querySelector('.card-hover-img');
      let touchStartX = 0;
      let wasSwipe    = false;

      // Mobile: swipe left/right to switch images
      card.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
        wasSwipe = false;
      }, { passive: true });

      card.addEventListener('touchend', e => {
        const diff = touchStartX - e.changedTouches[0].screenX;
        if (Math.abs(diff) > 40) {
          wasSwipe = true;
          hoverImg.style.animation = 'none';
          hoverImg.style.opacity   = diff > 0 ? '1' : '0';
        }
      }, { passive: true });

      // Click to open/close panel
      card.addEventListener('click', () => {
        if (wasSwipe) { wasSwipe = false; return; }
        if (activeCard === card) { closePanel(); return; }
        openPanel(card);
      });

      // Keyboard
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          if (activeCard === card) { closePanel(); return; }
          openPanel(card);
        }
      });
    });

    // ── Open panel ──
    function openPanel(card) {
      openingNow = true;
      setTimeout(() => { openingNow = false; }, 0);

      if (activePanel) { activePanel.remove(); activePanel = null; }

      activeCard = card;

      // Find last card in the same grid row by comparing top positions
      const cardTop  = card.getBoundingClientRect().top;
      const rowCards = cards.filter(c => Math.abs(c.getBoundingClientRect().top - cardTop) < 5);
      const last     = rowCards[rowCards.length - 1];

      const panel = buildPanel(card.dataset.collection);
      last.insertAdjacentElement('afterend', panel);
      activePanel = panel;

      // Double rAF ensures grid has re-laid before the class triggers transition
      requestAnimationFrame(() => requestAnimationFrame(() => {
        panel.classList.add('open');
      }));

      setTimeout(() => {
        panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 120);
    }

    // ── Close panel ──
    function closePanel() {
      if (!activePanel) return;
      const panel = activePanel;
      activePanel = null;
      activeCard  = null;
      panel.classList.remove('open');
      setTimeout(() => { if (panel.parentNode) panel.remove(); }, 520);
    }

    // ── Build panel ──
    function buildPanel(name) {
      const panel = document.createElement('div');
      panel.className = 'collection-panel';
      panel.setAttribute('role', 'region');
      panel.setAttribute('aria-label', esc(name) + ' — collection detail');

      const paintings = PAINTINGS[name] || [];
      const images = paintings.map(p => {
        const visual = p.src
          ? `<img src="${esc(p.src)}" alt="${esc(p.label)}">`
          : `<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg"
                 role="img" aria-label="${esc(name)} — ${esc(p.label)}">
              <rect width="300" height="200" fill="#EDD8CF"/>
              <text x="150" y="95" text-anchor="middle" fill="#9E8880" font-size="11"
                    font-family="Jost, sans-serif" font-weight="200" letter-spacing="2">${esc(name)}</text>
              <text x="150" y="115" text-anchor="middle" fill="#9E8880" font-size="10"
                    font-family="Jost, sans-serif" font-weight="200" letter-spacing="1">${esc(p.label)}</text>
            </svg>`;
        return `<div class="panel-item">
          <div class="panel-img-wrap">${visual}</div>
          <p class="panel-item-size">${esc(p.size)}</p>
          <p class="panel-item-medium">${esc(p.medium)}</p>
        </div>`;
      }).join('');

      panel.innerHTML = `
        <div class="panel-inner">
          <div class="panel-content">
            <div class="panel-header">
              <p class="panel-title">${esc(name)}</p>
              <button class="panel-close" aria-label="Close ${esc(name)} collection">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <polyline points="18 15 12 9 6 15"/>
                </svg>
              </button>
            </div>
            <div class="panel-scroll">${images}</div>
            <div class="panel-inquire">
              <p class="panel-inquire-eyebrow">Inquire about this collection</p>
              <p class="panel-inquire-sub">Interested in a piece from this collection? Get in touch.</p>
              <form class="panel-form" method="POST" action="https://api.web3forms.com/submit">
                <input type="hidden" name="access_key" value="f516efd2-9aa2-4905-905f-8db6f4e9373d">
                <input type="hidden" name="collection" value="${esc(name)}">
                <input type="hidden" name="subject"    value="Collection inquiry — ${esc(name)}">
                <input type="text"  name="name"    placeholder="Name"    required autocomplete="name">
                <input type="email" name="email"   placeholder="Email"   required autocomplete="email">
                <textarea           name="message" placeholder="Message" rows="4"  required></textarea>
                <button type="submit" class="panel-submit">Send inquiry</button>
              </form>
              <p class="panel-success">Your message has been received. We'll be in touch.</p>
            </div>
          </div>
        </div>`;

      // Close button
      panel.querySelector('.panel-close').addEventListener('click', e => {
        e.stopPropagation();
        closePanel();
      });

      // Lightbox on panel images
      panel.querySelectorAll('.panel-img-wrap img').forEach(img => {
        img.addEventListener('click', e => {
          e.stopPropagation();
          openLightbox(img.src, img.alt);
        });
      });

      // Form submit via fetch
      panel.querySelector('.panel-form').addEventListener('submit', async e => {
        e.preventDefault();
        const form = e.target;
        const btn  = form.querySelector('.panel-submit');
        btn.disabled    = true;
        btn.textContent = 'Sending…';
        try {
          const res  = await fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            body: new FormData(form)
          });
          const json = await res.json();
          if (json.success) {
            form.style.display = 'none';
            panel.querySelector('.panel-success').style.display = 'block';
          } else {
            btn.disabled    = false;
            btn.textContent = 'Send inquiry';
          }
        } catch {
          btn.disabled    = false;
          btn.textContent = 'Send inquiry';
        }
      });

      return panel;
    }

    // ── HTML escape ──
    function esc(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ── Close on resize (row positions change) ──
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(closePanel, 200);
    });

  })();
  </script>

</body>
</html>
